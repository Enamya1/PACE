camera:
  camera_index: 0
  resolution:
    width: 1280
    height: 720
  fps: 30
  frame_width: 640
  frame_height: 480
  target_fps: 30
  max_consecutive_failures: 15
  backend: auto

detection:
  backend: mediapipe
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  eye_roi_margin_px: 8
  eye_roi_output_size: [120, 80]
  max_consecutive_misses: 10

preprocess:
  blur_kernel_size: 5
  blur_sigma: 0.0
  threshold_mode: adaptive
  manual_threshold_value: 60
  adaptive_block_size: 25
  adaptive_c: 7
  morph_kernel_size: 3
  morph_open_iterations: 2
  morph_close_iterations: 2
  min_valid_brightness: 8.0
  max_valid_brightness: 240.0

tracking:
  jitter_smoothing: 0.6
  sensitivity: 1.0
  cursor_delay_ms: 0

blink:
  blink_threshold: 0.25
  blink_click_count: 2

storage:
  save_logs_to_aws: false
  save_eye_frames: false
