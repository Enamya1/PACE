camera:
  camera_index: 0
  resolution:
    width: 1280
    height: 720
  fps: 30
  frame_width: 640
  frame_height: 480
  target_fps: 30
  max_consecutive_failures: 15
  backend: auto

tracking:
  jitter_smoothing: 0.6
  sensitivity: 1.0
  cursor_delay_ms: 0

blink:
  blink_threshold: 0.25
  blink_click_count: 2

storage:
  save_logs_to_aws: false
  save_eye_frames: false
