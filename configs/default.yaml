camera:
  camera_index: 0
  resolution:
    width: 1280
    height: 720
  fps: 30
  frame_width: 640
  frame_height: 480
  target_fps: 30
  max_consecutive_failures: 15
  backend: auto

detection:
  backend: mediapipe
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  eye_roi_margin_px: 8
  eye_roi_output_size: [120, 80]
  max_consecutive_misses: 10

preprocess:
  blur_kernel_size: 5
  blur_sigma: 0.0
  threshold_mode: otsu
  manual_threshold_value: 60
  adaptive_block_size: 25
  adaptive_c: 5
  morph_kernel_size: 3
  morph_open_iterations: 1
  morph_close_iterations: 2
  min_valid_brightness: 15.0
  max_valid_brightness: 240.0

pupil:
  min_pupil_area_ratio: 0.01
  max_pupil_area_ratio: 0.35
  min_circularity: 0.55
  use_kalman_tracking: true
  kalman_process_noise: 0.01
  kalman_measurement_noise: 0.1
  max_center_jump_px: 25.0
  min_confidence_to_accept: 0.4
  kalman_max_prediction_frames: 5

glint:
  brightness_threshold: 220
  min_glint_area_px: 1.0
  max_glint_area_px: 60.0
  min_circularity: 0.65
  max_distance_from_pupil_px: 40.0
  detector_backend: contour
  min_confidence_to_accept: 0.4

gaze_feature:
  eye_scale_source: pupil_radius
  fixed_eye_scale_px: 15.0
  min_pupil_confidence: 0.4
  min_glint_confidence: 0.4
  fusion_mode: confidence_weighted
  smoothing_window: 3

tracking:
  jitter_smoothing: 0.6
  sensitivity: 1.0
  cursor_delay_ms: 0

blink:
  blink_threshold: 0.25
  blink_click_count: 2

storage:
  save_logs_to_aws: false
  save_eye_frames: false
